# Title, description and other prose of the published GLACE catalog.
#
# `scripts/render-catalog.py` writes everything in `catalog/` from this file,
# `assets.yaml` and `templates/`. Edit these sources, then re-render;
# `tests/test_render.py` checks that `catalog/` matches them.
#
# Prose fields may use these Jinja2 variables: region, first_year, last_year,
# n_assets, n_viz, max_zoom, analysis_resolution, and `year` in fields that
# describe one year. Collection ids and grids come from
# `src/glace_catalog/scopes.py`, for the scope named below.

scope: alps
region: the Alpine Convention perimeter
# The years the catalog covers, used in the prose and as the temporal extent
# of the tracked collections. Publication sets the exact extent from the
# compositing windows.
years:
  first: 2015
  last: 2026

title: GLACE Alps
subtitle: Sentinel-1 Glacier Coherence and Backscatter
# Shown under the title at the top of the READMEs.
tagline: >-
  Sentinel-1 interferometric coherence and backscatter composites of the
  European Alps

# A release-status note for the root README and AGENTS.md, shown when
# non-empty.
preliminary_notice: ""

# Pitfalls that give plausible but wrong results, and known gaps in the data,
# for the root README and AGENTS.md. The wording and numbers of the first four
# follow the Usage Notes and Technical Validation of the data paper.
usage_notes:
  - title: Composite quality
    text: >-
      Lower `*_qa_cqm` values indicate a lower local resolution of the
      composite: the closer to 0, the fewer favourable viewing geometries
      contributed. In the validation, a random forest maps glaciers less
      accurately where the CQM is below 0.5 (linear, about −3 dB; AUC 0.87)
      than elsewhere (0.97). These pixels make up 3% of the pixels within
      250 m of the glacier outlines and 1.5% of the glacier pixels. Mask or
      downweight them, or use the CQM as an additional model input.
  - title: Coherence bias
    text: >-
      Coherence is estimated over a 35 × 7 (range × azimuth) window. The
      finite window biases the estimate upwards, so fully decorrelated
      surfaces do not reach 0: over large lakes, the mean is about 0.09.
      Absolute values therefore differ from products that use larger windows,
      such as the global seasonal Sentinel-1 coherence of
      [Kellndorfer et al. (2022)](https://doi.org/10.1038/s41597-022-01189-6).
      Do not compare values across products, and choose thresholds on GLACE
      itself.
  - title: Low coherence outside glaciers
    text: >-
      Other surfaces also decorrelate over 12 days and can have similarly low
      coherence, such as snow patches, lakes and unstable slopes.
  - title: Validated scope
    text: >-
      The validation covers glacier mapping in Switzerland only. Its scores
      do not describe glacier mapping performance in other parts of the Alps,
      or farther than 250 m from the glacier outlines. Other applications may
      also benefit from the composites, but were not validated.
  - title: 2015 coverage
    text: >-
      In 2015, coherence is missing on 91 MGRS squares in the north-central
      Alps (100 km squares 32TNT, 32TNU, 32TPT, 32TPU and 32UPU) because
      Sentinel-1 coverage was limited that summer. Two of them, 32TNT14 and
      32TNT24, have no 2015 items. Every other year covers all squares.

description: >-
  Annual summer composites of Sentinel-1 12-day repeat-pass interferometric
  coherence (COH12) and radiometrically terrain-corrected backscatter (RTC).
  The data covers {{ region }}, {{ first_year }}–{{ last_year }}. The
  analysis-ready composites are locally resolution weighted (LRW) after
  [Small et al. (2022)](https://doi.org/10.1109/TGRS.2021.3055562), so each
  output pixel is dominated by acquisitions with high spatial resolution.
  Each year's 90-day averaging period was chosen by minimizing the MODIS NDSI
  over the target area.


  The composites are available in two separate collections: tiles
  (10 km × 10 km MGRS grid squares, UTM, 10 m grid spacing) and mosaics on
  one fixed equal-area grid (ETRS89-LAEA, 40 m grid spacing). Every
  cloud-optimized GeoTIFF is LERC-compressed and carries its processing
  record in its own tags. For web maps, such as the
  [GLACE Viewer](https://lqgentner.github.io/glace-viewer), raster PMTiles
  in Web Mercator hold 8-bit value-encoded WebP tiles.

license: CC-BY-4.0

# The dataset's DOIs at LaRS. `canonical` names every version; `versions` maps
# each DATASET_VERSION to its own DOI, the collections' sci:doi. Rendering
# fails if the current version has none. `citation` may use `version` and
# `doi` (the version DOI).
doi:
  canonical: 10.48656/d4r9-fj97
  versions:
    "1.0": 10.48656/60er-3j55
citation: >-
  Gentner, L. Q. (2026). GLACE Alps (Version {{ version }}) [Data set]. LaRS –
  Language Repository of Switzerland. https://doi.org/{{ doi }}

keywords:
  - Sentinel-1
  - SAR
  - InSAR coherence
  - Backscatter
  - Glaciers
  - Cryosphere
  - Alps

providers:
  - name: European Space Agency / Copernicus
    description: >-
      Operates the Sentinel-1 mission and distributes the SLC data these
      composites are derived from, through the Copernicus Data Space Ecosystem.
    roles: [producer, licensor]
    url: https://sentinel.esa.int/web/sentinel/missions/sentinel-1
  - name: University of Zurich, Department of Geography
    description: >-
      Produced the composites from Copernicus Sentinel-1 SLC data: burst
      extraction, coherence estimation, radiometric terrain correction and
      local resolution weighted compositing. Derived the annual mosaics and
      maintains this catalog.
    roles: [producer, processor, licensor, host]
    url: https://www.geo.uzh.ch/en.html

# External links of the root catalog, by name; the templates refer to them by
# name. Each carries its link relation; `preview` is also repeated on both
# collections. The catalog is official, so none is a `via` link: Portolan
# keeps that relation for a mirror's upstream source.
links:
  source_coop:
    rel: alternate
    href: https://source.coop/giuz/glace-alps
    title: This catalog on Source Cooperative
  vcs:
    rel: vcs
    href: https://github.com/lqgentner/glace-catalog
    title: Source repository
  issues:
    rel: issues
    href: https://github.com/lqgentner/glace-catalog/issues
    title: Issue tracker
  viewer:
    rel: preview
    href: https://lqgentner.github.io/glace-viewer
    title: GLACE Viewer, an interactive web map
  pipeline:
    rel: related
    href: https://github.com/lqgentner/glace-production
    title: Production pipeline

collections:
  tiles:
    title: GLACE tiles – Sentinel-1 Composites on MGRS squares (10 m)
    short_title: GLACE tiles
    keywords: [MGRS]
    description: >-
      The GLACE composites on 10 km MGRS grid squares in their own UTM zone at
      10 m grid spacing, one item per square and year. Each item carries
      {{ n_assets }} single-band Cloud-Optimized GeoTIFFs: coherence and
      backscatter in VV and VH, and for each of the four a
      contributing-observations count and a composite quality map. Stored
      values are linear; the renders declare the decibel conversion
      (`10*log10(x)`) for display. Search the tiles with the item index
      `items.parquet`.
    # Description of each year sub-catalog.
    year_description: >-
      The MGRS squares composited in {{ year }}, one item each, every item
      carrying that square's {{ n_assets }} single-band composites.
  mosaics:
    title: GLACE mosaics – Sentinel-1 Composites on ETRS89-LAEA (40 m)
    short_title: GLACE mosaics
    keywords: [mosaic]
    # Description of the style assets: with `year` for the style on that
    # year's mosaic item, without it for the collection's style.
    style_description: >-
      {% if year is defined %}Every published web-map layer of {{ year }}, the
      first visible and the rest hidden.{% else %}Every web-map layer of the
      latest published year, the first visible and the rest hidden. Each
      year's mosaic item carries the style of its own year, as
      styles/default.json beside its archives.{% endif %} Each archive is a
      raster-dem source whose custom encoding decodes its values, drawn by a
      color-relief layer with a default color ramp that a client can change.
    description: >-
      One mosaic per year of the GLACE composites, resampled from the MGRS
      tiles onto ETRS89-LAEA (EPSG:3035) at {{ analysis_resolution }} m.
      The grid is equal-area, for area statistics, and every year shares the
      same extent, so years stack directly.
      {{ n_assets | capitalize }} single-band
      analysis rasters per year, in linear units, each a Cloud-Optimized
      GeoTIFF with internal overviews. For web maps, each year also has
      {{ n_viz }} PMTiles archives on the WebMercatorQuad grid up to zoom
      {{ max_zoom }}.
    # Description of each annual mosaic item.
    item_description: >-
      Annual mosaics of the GLACE composites for {{ year }}, on a fixed
      equal-area grid (ETRS89-LAEA, {{ analysis_resolution }} m) every year of
      this collection shares.
