# The twelve assets of the GLACE catalog and their web-map archives.
#
# This file is the single source of asset names, descriptions, color ramps
# and value ranges. The build and `scripts/render-catalog.py` read it (through
# `glace_catalog.metadata`) to write the collections, items, styles and the
# asset tables in the READMEs and AGENTS.md files.
#
# stretch:    the default display range, drawn with `cmap`.
# transport:  the value range a web-map archive encodes into codes 1-255
#             (0 is nodata). Changing it requires re-tiling every year.
# provenance: GeoTIFF tags every raster of an asset key carries with the same
#             value, on every tile and in every year. The tiles collection's
#             item_assets state them once, as glace:* fields, so its items do
#             not repeat them; the build refuses a raster whose tags differ.
#             An asset's set merges the top-level `provenance`, its product's
#             `all`, then the product's `data` or its QA metric's set.

provenance:
  METADATA_VOCABULARY: >-
    CEOS-ARD PFS SAR v1.3.1;
    https://ceos.org/ard/files/PFS/SAR/v1.3.1/CEOS-ARD_PFS_SAR_v1.3.1.pdf
  PIXEL_COORDINATE_CONVENTION: pixel centre
  SOURCE_DATA_PRODUCT_LEVEL: L2
  PIPELINE_SOFTWARE_URL: https://github.com/lqgentner/s1bursts
  COMPOSITING_METHOD: Local resolution weighting
  COMPOSITING_METHOD_REFERENCE: https://doi.org/10.1109/TGRS.2021.3055562

products:
  coh12:
    name: Coherence
    long: 12-day repeat-pass interferometric coherence
    # What one observation is, as the count descriptions name it.
    observations: interferometric pairs
    sar_product_type: COH
    # What the stored values are; appended to each data asset's description.
    value: Dimensionless, in [0, 1].
    # cmap is the intended Scientific colour map (cmcrameri); portable_cmap is
    # the matplotlib equivalent named in `renders`, for generic clients.
    cmap: cmc.lipari
    portable_cmap: magma
    decibel: false
    stretch:
      vv: [0.1, 0.7]
      vh: [0.1, 0.55]
    transport:
      vv: [0.0, 1.0]
      vh: [0.0, 1.0]
    cqm:
      stretch: [-2.5, 4.0]
      transport: [-20.0, 14.0]
    # A QA layer's PRODUCT_TYPE appends its metric, as in COH_LRW_QA-NUM.
    provenance:
      all:
        PRODUCT_FAMILY: Composite Coherence
        PRODUCT_TYPE: COH_LRW
        COMPOSITING_PARAMETERS: aggregation=mean;clip_max_resolution=5;burst_edge_trim_px=7
        COHERENCE_WINDOW_RANGE: 35
        COHERENCE_WINDOW_AZIMUTH: 7
      data:
        COMPOSITING_METHOD: >-
          Local resolution weighting (Small et al. 2022) applied to 12-day
          repeat-pass coherence
        MEASUREMENT_TYPE: Coherence
        TEMPORAL_BASELINE_DAYS: 12
        PHASE_QUALITY_METHOD: Coherence
        PHASE_QUALITY_REFERENCE: >-
          Magnitude of the complex correlation coefficient over the estimation
          window, as computed by the ESA SNAP Coherence operator.
        COHERENCE_WEIGHTING_SHAPE: Rectangular
  rtc:
    name: Backscatter
    long: Radiometrically terrain-corrected gamma-nought backscatter
    observations: acquisitions
    sar_product_type: RTC
    value: Linear power.
    cmap: cmc.grayC
    portable_cmap: gray
    decibel: true
    stretch:
      vv: [-14.5, -3.5]
      vh: [-22.5, -10.5]
    transport:
      vv: [-25.0, 10.0]
      vh: [-31.0, 2.0]
    cqm:
      stretch: [-3.0, 4.0]
      transport: [-20.0, 12.0]
    provenance:
      all:
        PRODUCT_FAMILY: Composite Backscatter
        PRODUCT_TYPE: RTC_LRW
        COMPOSITING_PARAMETERS: aggregation=mean;clip_max_resolution=5;burst_edge_trim_px=4
      data:
        BACKSCATTER_MEASUREMENT: Gamma-0
        BACKSCATTER_CONVENTION: Power
        BACKSCATTER_CONVERSION_EQ: dB = 10*log10(DN)

polarizations:
  vv: co-polarized
  vh: cross-polarized

qa:
  num:
    name: Contributing Observations
    # The same ranges for coherence and backscatter.
    cmap: cmc.glasgow
    portable_cmap: viridis
    stretch: [0.0, 70.0]
    transport: [0.0, 253.0]
    decibel: false
    # Tiles store an integer count. Each 20 m mosaic pixel averages four
    # 10 m pixels, so the mosaics store a float mean count.
    band:
      tiles: {data_type: uint16, nodata: 0}
      mosaics: {data_type: float32, nodata: nan}
    provenance:
      QA_LAYER: Contributing Observations Image
  cqm:
    name: Composite Quality Map
    cmap: cmc.glasgow
    portable_cmap: viridis
    # Ranges are set per product, under `products.*.cqm`.
    decibel: true
    band:
      tiles: {data_type: float32, nodata: nan}
      mosaics: {data_type: float32, nodata: nan}
    provenance:
      QA_LAYER: Composite Quality Map Image
      CQM_CONVERSION_EQ: dB = 10*log10(DN)

# Asset descriptions. Jinja2 variables: long, product (short name),
# observations, POL, pol_word, value, source_title, transport, min_zoom, max_zoom.
descriptions:
  data:
    tiles: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), composited with local resolution weighting
      over the year's summer window on the 10 m MGRS grid. {{ value }}
    mosaics: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), resampled from the 10 m tiles onto the 20 m
      equal-area grid by averaging in the linear domain. {{ value }}
  num:
    tiles: >-
      Number of {{ observations }} that contributed to the {{ product }} {{ POL }} composite
      with a non-zero resolution weight.
    mosaics: >-
      Mean number of {{ observations }} that contributed to the {{ product }} {{ POL }}
      composite. Each pixel is the average of the original 10 m pixel counts.
  cqm:
    tiles: >-
      Composite quality map of the {{ product }} {{ POL }} composite, its local
      resolution. Higher values are better resolved. Linear.
    mosaics: >-
      Composite quality map of the {{ product }} {{ POL }} composite, its local
      resolution, averaged onto the 20 m grid. Higher values are better
      resolved. Linear.
  viz: >-
    Web-map tiles of {{ source_title }} on WebMercatorQuad
    z{{ min_zoom }}-z{{ max_zoom }}, as lossy WebP (quality 90). Each pixel
    stores an 8-bit code in all three channels. Codes 1 to 255 map linearly
    onto {{ transport }}, with values beyond clipped. Code 0 is nodata.
    Decode with the band's raster:scale and raster:offset. For analysis, use
    the COGs.

# The columns of each collection's item mirror, `items.parquet`, in the order
# the files hold them. The collections publish them as `table:columns` and the collection AGENTS.md
# files as a table; finalization adds each column's type from the written file
# and refuses a file whose columns differ from this list. A description is one
# string, or one per collection, and may name the scope's glacier_inventory and
# glacier_buffer_m. `collections` limits a column to one of them.
mirror_columns:
  - name: type
    description: Always `Feature`.
  - name: stac_version
    description: STAC version of the item.
  - name: stac_extensions
    description: Schema URIs of the STAC extensions the item uses.
  - name: id
    description:
      tiles: Item id, `{mgrs_tile}-{year}`, such as `32TMS55-2024`.
      mosaics: Item id, `{scope}-mosaic-{year}`, such as `alps-mosaic-2024`.
  - name: geometry
    description:
      tiles: >-
        Footprint of the MGRS square in WGS84 (EPSG:4326), as WKB: its four
        corners.
      mosaics: >-
        Footprint of the year's mosaic in WGS84 (EPSG:4326), as WKB: the
        union of the year's tiles, simplified.
  - name: bbox
    description: >-
      Bounds of the footprint in WGS84, the GeoParquet covering column.
  - name: links
    description: >-
      The item document's links, with absolute hrefs: root, collection,
      parent, and the CEOS-ARD specification.
  - name: assets
    description:
      tiles: >-
        One struct per asset key, with absolute https hrefs. An asset a tile
        lacks, such as coherence on the 2015 gap tiles, is null.
      mosaics: One struct per asset key, with absolute https hrefs.
  - name: collection
    description:
      tiles: Id of the collection, `glace-{scope}-tiles`.
      mosaics: Id of the collection, `glace-{scope}-mosaics`.
  - name: start_datetime
    description: First day of the year's compositing window, at 00:00 UTC.
  - name: end_datetime
    description: The day after the window's last day, at 00:00 UTC.
  - name: constellation
    description: Always `sentinel-1`.
  - name: instruments
    description: Always `[c-sar]`.
  - name: sar:instrument_mode
    description: Always `IW`, Interferometric Wide swath.
  - name: sar:frequency_band
    description: Always `C`.
  - name: sar:polarizations
    description: Polarizations with at least one composite, `VV` and `VH`.
  - name: version
    collections: [tiles]
    description: Dataset version the item belongs to.
  - name: glace:mgrs_tile
    collections: [tiles]
    description: The 10 km MGRS square, such as `32TMS55`.
  - name: grid:code
    collections: [tiles]
    description: The MGRS square in the STAC grid extension's form, `MGRS-32TMS55`.
  - name: mgrs:utm_zone
    collections: [tiles]
    description: UTM zone of the square.
  - name: mgrs:latitude_band
    collections: [tiles]
    description: MGRS latitude band of the square.
  - name: mgrs:grid_square
    collections: [tiles]
    description: Identifier of the MGRS 100 km grid square, the two letters after the band.
  - name: proj:code
    description:
      tiles: CRS of the item's rasters, which is the square's UTM zone, such as `EPSG:32632`.
      mosaics: CRS of the item's COGs, `EPSG:3035`.
  - name: proj:shape
    description: Raster shape of the item's COGs, `[rows, columns]`.
  - name: proj:transform
    description: Affine transform of the item's COGs, six coefficients in `proj:code` units.
  - name: version
    collections: [mosaics]
    description: Dataset version the item belongs to.
  - name: description
    collections: [mosaics]
    description: Description of the item.
  - name: glace:coh_first_acquisition
    collections: [tiles]
    description: Date of the first acquisition in the square's coherence composites, `YYYY-MM-DD`.
  - name: glace:coh_last_acquisition
    collections: [tiles]
    description: >-
      Date of the last acquisition in the square's coherence composites. About
      twelve days before the last backscatter date, because both images of a
      pair must lie inside the window.
  - name: glace:rtc_first_acquisition
    collections: [tiles]
    description: Date of the first acquisition in the square's backscatter composites.
  - name: glace:rtc_last_acquisition
    collections: [tiles]
    description: Date of the last acquisition in the square's backscatter composites.
  - name: glace:glacier_fraction
    collections: [tiles]
    description: >-
      Share of the square inside {{ glacier_inventory }} glacier outlines,
      0 to 1. The same every year.
  - name: glace:glacier_fraction_buffered
    collections: [tiles]
    description: >-
      Share of the square inside the same outlines buffered by
      {{ glacier_buffer_m }} m, 0 to 1. The same every year.
  - name: processing:level
    collections: [tiles]
    description: Always `L3`.
  - name: glace:dem
    collections: [tiles]
    description: DEM used for terrain correction and geocoding.
  - name: processing:software
    collections: [tiles]
    description: >-
      Versions of the software that made the square's composites, such as
      `{"s1bursts": "0.9.0", "ESA SNAP": "14.0.0"}`.
  - name: datetime
    description: Midpoint of the compositing window.
