# The asset vocabulary of the GLACE catalog.
#
# This is the one place the twelve assets and their web-map archives are
# named, described, given a transport range and a default display.
# `glace_catalog.metadata` reads it; from it come the `item_assets` and
# `renders` of both collections, the style's sources and colour ramps, the
# titles on every tile and mosaic item, the `visual` assets, and the tables in
# every README and AGENTS.md.
# Nothing else in the repository types an asset title, a range or a stretch.
#
# transport: the range a web-map archive is encoded over (codes 1-255, 0 is
#            nodata); changing it means re-tiling every year.
# stretch:   the default range a style draws with `cmap`.
#
# Every rendered document is regenerated from this file by
# `scripts/render-catalog.py`; `tests/test_render.py` fails when the tracked
# `catalog/` and a fresh render differ.

products:
  coh12:
    name: Coherence
    long: 12-day repeat-pass interferometric coherence
    sar_product_type: COH
    # The one sentence on what the stored values are, appended to every data
    # asset's description on both grids.
    value: Dimensionless, in [0, 1].
    # cmc.lipari is the designed ramp (perceptually uniform, Crameri); magma is
    # the portable stand-in a client without cmcrameri can resolve (M-10).
    cmap: cmc.lipari
    portable_cmap: magma
    decibel: false
    stretch:
      vv: [0.1, 0.75]
      vh: [0.1, 0.55]
    transport:
      vv: [0.0, 1.0]
      vh: [0.0, 1.0]
    cqm:
      stretch: [-3.0, 10.0]
      transport: [-13.0, 19.0]
  rtc:
    name: Backscatter
    long: Radiometrically terrain-corrected gamma-nought backscatter
    sar_product_type: RTC
    value: >-
      Linear power. The decibel conversion, 10*log10, is declared in the
      collection's renders and not applied to the stored pixels.
    cmap: cmc.grayC
    portable_cmap: gray
    decibel: true
    stretch:
      vv: [-16.5, -4.0]
      vh: [-23.5, -11.0]
    transport:
      vv: [-25.0, 5.0]
      vh: [-31.0, -1.0]
    cqm:
      stretch: [-4.0, 8.0]
      transport: [-13.0, 12.0]

polarizations:
  vv: co-polarized
  vh: cross-polarized

qa:
  num:
    name: Contributing Observations
    # One range for both products
    cmap: cmc.glasgow
    portable_cmap: viridis
    stretch: [0.0, 90.0]
    transport: [0.0, 253.0]
    decibel: false
    # The band name is the asset key on every grid; only the pixel type
    # differs. An integer count on the 10 m tiles; warping to 40 m averages
    # sixteen source pixels, so the mosaic band is a float mean of the counts.
    band:
      tiles: {data_type: uint16, nodata: 0}
      mosaics: {data_type: float32, nodata: nan}
  cqm:
    name: Composite Quality Map
    cmap: cmc.glasgow
    portable_cmap: viridis
    # The ranges are per product: `products.*.cqm`.
    decibel: true
    band:
      tiles: {data_type: float32, nodata: nan}
      mosaics: {data_type: float32, nodata: nan}

# Description sentences, Jinja2 templates over: long, product (short name),
# POL, pol_word, value, source_title, transport, min_zoom, max_zoom.
descriptions:
  data:
    tiles: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), composited with local resolution weighting
      over the year's summer window on the 10 m MGRS grid. {{ value }}
    mosaics: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), resampled from the 10 m tiles onto the 40 m
      equal-area grid by averaging in the linear domain. {{ value }}
  num:
    tiles: >-
      Number of acquisitions that contributed to the {{ product }} {{ POL }} composite
      with a non-zero resolution weight.
    mosaics: >-
      Mean number of acquisitions that contributed to the {{ product }} {{ POL }}
      composite, averaged over the 10 m pixels inside each 40 m pixel: a float
      mean of the counts.
  cqm:
    tiles: >-
      Composite quality of the {{ product }} {{ POL }} composite: the local
      resolution of the weighted composite, where higher is better resolved.
      Linear scaling; the decibel conversion is declared in the collection's
      renders.
    mosaics: >-
      Composite quality of the {{ product }} {{ POL }} composite: the local
      resolution of the weighted composite, where higher is better resolved,
      averaged onto the 40 m grid. Linear scaling; the decibel conversion is
      declared in the collection's renders.
  viz: >-
    Value-encoded WebP tiles of {{ source_title }} on WebMercatorQuad
    z{{ min_zoom }}-z{{ max_zoom }}: an 8-bit code in all three channels,
    linear over {{ transport }} and clipped outside it, code 0 nodata. The
    band's raster:scale and raster:offset decode it, as does the year
    style's raster-dem source, which draws it through a color-relief ramp.
    Lossy at WebP quality 90; for analysis, read the COGs with the "data" role
    instead.
