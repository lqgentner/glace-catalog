# The twelve assets of the GLACE catalog and their web-map archives.
#
# This file is the single source of asset names, descriptions, colour ramps
# and value ranges. The build and `scripts/render-catalog.py` read it (through
# `glace_catalog.metadata`) to write the collections, items, styles and the
# asset tables in the READMEs and AGENTS.md files.
#
# stretch:   the default display range, drawn with `cmap`.
# transport: the value range a web-map archive encodes into codes 1-255
#            (0 is nodata). Changing it requires re-tiling every year.

products:
  coh12:
    name: Coherence
    long: 12-day repeat-pass interferometric coherence
    sar_product_type: COH
    # What the stored values are; appended to each data asset's description.
    value: Dimensionless, in [0, 1].
    # cmap is the intended Scientific colour map (cmcrameri); portable_cmap is
    # the matplotlib equivalent named in `renders`, for generic clients.
    cmap: cmc.lipari
    portable_cmap: magma
    decibel: false
    stretch:
      vv: [0.1, 0.75]
      vh: [0.1, 0.55]
    transport:
      vv: [0.0, 1.0]
      vh: [0.0, 1.0]
    cqm:
      stretch: [-2.5, 8.0]
      transport: [-13.0, 19.0]
  rtc:
    name: Backscatter
    long: Radiometrically terrain-corrected gamma-nought backscatter
    sar_product_type: RTC
    value: >-
      Linear power. For display, the collection's renders declare the decibel
      conversion, 10*log10.
    cmap: cmc.grayC
    portable_cmap: gray
    decibel: true
    stretch:
      vv: [-14.5, -4.5]
      vh: [-21.0, -11.0]
    transport:
      vv: [-25.0, 5.0]
      vh: [-31.0, -1.0]
    cqm:
      stretch: [-2.5, 7.5]
      transport: [-13.0, 12.0]

polarizations:
  vv: co-polarized
  vh: cross-polarized

qa:
  num:
    name: Contributing Observations
    # The same ranges for coherence and backscatter.
    cmap: cmc.glasgow
    portable_cmap: viridis
    stretch: [8.0, 40.0]
    transport: [0.0, 253.0]
    decibel: false
    # Tiles store an integer count. Each 40 m mosaic pixel averages sixteen
    # 10 m pixels, so the mosaics store a float mean count.
    band:
      tiles: {data_type: uint16, nodata: 0}
      mosaics: {data_type: float32, nodata: nan}
  cqm:
    name: Composite Quality Map
    cmap: cmc.glasgow
    portable_cmap: viridis
    # Ranges are set per product, under `products.*.cqm`.
    decibel: true
    band:
      tiles: {data_type: float32, nodata: nan}
      mosaics: {data_type: float32, nodata: nan}

# Asset descriptions. Jinja2 variables: long, product (short name), POL,
# pol_word, value, source_title, transport, min_zoom, max_zoom.
descriptions:
  data:
    tiles: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), composited with local resolution weighting
      over the year's summer window on the 10 m MGRS grid. {{ value }}
    mosaics: >-
      {{ long }}, {{ pol_word }} ({{ POL }}), resampled from the 10 m tiles onto the 40 m
      equal-area grid by averaging in the linear domain. {{ value }}
  num:
    tiles: >-
      Number of acquisitions that contributed to the {{ product }} {{ POL }} composite
      with a non-zero resolution weight.
    mosaics: >-
      Mean number of acquisitions that contributed to the {{ product }} {{ POL }}
      composite, averaged over the 10 m pixels inside each 40 m pixel: a float
      mean of the counts.
  cqm:
    tiles: >-
      Composite quality of the {{ product }} {{ POL }} composite: the local
      resolution of the weighted composite, where higher is better resolved.
      Linear scaling; the decibel conversion is declared in the collection's
      renders.
    mosaics: >-
      Composite quality of the {{ product }} {{ POL }} composite: the local
      resolution of the weighted composite, where higher is better resolved,
      averaged onto the 40 m grid. Linear scaling; the decibel conversion is
      declared in the collection's renders.
  viz: >-
    Value-encoded WebP tiles of {{ source_title }} on WebMercatorQuad
    z{{ min_zoom }}-z{{ max_zoom }}: an 8-bit code in all three channels,
    linear over {{ transport }} and clipped to it, with code 0 as nodata.
    Decode with the band's raster:scale and raster:offset; the year's style
    decodes it as a raster-dem source and colours it with a color-relief
    layer. Lossy (WebP quality 90): for analysis, read the COGs with the
    "data" role.
