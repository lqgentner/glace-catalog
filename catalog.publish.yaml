# Where the built store is published.
#
# tools/sync_data.py uploads every object under GLACE_STORE_ROOT to
# write_prefix. The tracked catalog/ directory is never uploaded directly.

# Upload target. The profile's endpoint is the Source Cooperative S3 proxy
# (https://data.source.coop), where the bucket is the account and the key
# starts with the product.
write_prefix: s3://giuz/glace-alps

# Public HTTPS address of write_prefix. Every absolute href in the published
# STAC documents starts with it.
public_base: https://data.source.coop/giuz/glace-alps

# The same tree over anonymous S3, used in the `alternate` href of each
# collection asset.
public_s3_base: s3://eu-central-1.opendata.source.coop/giuz/glace-alps

# Named profile in ~/.aws/credentials holding the Source Cooperative
# credentials.
profile: source-coop
