# Derived from portolan-sdi/portolan-catalog-template (Apache-2.0) and
# rewritten; see THIRD_PARTY_NOTICES.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv.lock is tracked (R-15) so that CI and a fresh clone resolve to the
      # same dependency set. --locked fails instead of re-resolving when the
      # lock and pyproject.toml have drifted apart, which is the whole point of
      # committing it. The interpreter comes from requires-python.
      #
      # --all-groups installs `dev` (ruff, pyrefly, the typing stubs that
      # tests/test_lint.py needs) and `validate` (rashid, stac-check). rashid
      # takes a floor there, not a pin: a pin goes stale the day it is written,
      # and the gate checks the same range at run time, so a local rashid
      # cannot be older either. stac-check stays unpinned on purpose — the
      # stac-check exemption in docs/conformance.md expires when the upstream
      # crash stops, which only happens if CI takes each new release.
      - name: Install the locked environment
        run: uv sync --all-groups --locked

      # pyflakes covers the three gates vendored from the catalog template,
      # which ruff deliberately excludes so a re-sync stays a merge. It is not
      # a project dependency for that reason. The ruff and pyrefly gates in
      # tests/test_lint.py cover everything this repo writes, tools/ included.
      - name: Lint the vendored gates
        run: uv run --with pyflakes pyflakes tests/test_links.py tests/test_stac_valid.py tests/test_conformance.py

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: uv run tests/run_all.py
