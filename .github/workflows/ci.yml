# Derived from portolan-sdi/portolan-catalog-template (Apache-2.0) and
# rewritten; see THIRD_PARTY_NOTICES.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails rather than re-resolving when uv.lock and pyproject.toml
      # have drifted apart. --all-groups adds dev and validate; only
      # stac-check stays unpinned, so CI takes the release that fixes the crash
      # docs/conformance.md tolerates.
      - name: Install the locked environment
        run: uv sync --all-groups --locked

      # ruff excludes the vendored gates so a re-sync stays a merge; pyflakes
      # covers them instead, and is not a project dependency for that reason.
      - name: Lint the vendored gates
        run: uv run --with pyflakes pyflakes tests/test_links.py tests/test_stac_valid.py tests/test_conformance.py

      # The checkout holds the metadata and not the bytes, so CI_LIGHT exempts
      # asset hrefs with a data suffix from the link check. Unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: uv run tests/run_all.py
