[project]
name = "glace_catalog"
description = "Builds and publishes the GLACE Portolan/STAC catalog"
authors = [
  { name = "Luis Gentner", email = "luis.gentner@geo.uzh.ch" },
]
readme = "README.md"
requires-python = ">=3.13"
license.file = "LICENSE"
dynamic = ["version"]

dependencies = [
    "boto3>=1.42.84",
    "cmcrameri>=1.9",
    "defusedxml>=0.7.1",
    "freezebase[s3]>=0.7,<0.8",
    "fsspec>=2026.6.0",
    "geopandas>=1.1",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.3",
    "pillow",
    "pyarrow",
    "pydantic-settings>=2.13.1",
    "pyproj>=3.5",
    "pystac[validation]>=1.14.3",
    "pyyaml>=6.0",
    "rasterio>=1.4.3",
    "rio-cogeo>=5.4.2",
    # The raster PMTiles tiler, invoked as the `rio pmtiles` CLI plugin by
    # webmap.py. Declared because M-25 makes PMTiles the only display product:
    # undeclared, `publish-year.py --steps pmtiles` could not run from a clean
    # `uv sync`, which is a build that cannot be reproduced from a checkout.
    "rio-pmtiles>=1.1",
    "rustac>=0.9",
    # 2026.7.0 fixes fsspec/s3fs#1034: before it, one prefixed glob caches a
    # partial listing under the directory key, so later globs and `exists()`
    # report existing objects as missing.
    "s3fs>=2026.7.0",
    "shapely>=2",
    "stac-geoparquet>=0.8.1",
    "tqdm",
    "universal-pathlib>=0.2.6",
]

[dependency-groups]
# Tighter floors for development dependencies: they track the toolchain CI
# actually runs. That matters most for ruff and mypy, whose output is
# version-dependent, and these match s1bursts so a finding in one repository
# reproduces in the other.
dev = [
    "mypy>=2.3",
    "pandas-stubs>=3.0",
    "ruff>=0.16",
    "types-PyYAML>=6.0",
    "types-requests>=2.33",
    "types-tqdm>=4.67",
]
# The conformance gate. Pinned as a floor, not a pin: a pin goes stale on the
# next release and rashid's rule set is what this catalog claims to pass. 0.1.8
# is the first release carrying the spec v0.2.0 rules — 0.1.5 through 0.1.7
# report an error for a `self` link and for an absolute structural href, both of
# which v0.2.0 allows.
validate = [
    "rashid>=0.1.8,<0.2.0",
    "stac-check",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/glace_catalog"]

[tool.uv]
default-groups = ["dev", "validate"]

[tool.ruff]
line-length = 99
src = ["src/glace_catalog"]

# tools/publish.py, tools/upload_data.py and the gates that came with them are
# vendored from portolan-sdi/portolan-catalog-template and kept byte-close to
# upstream, so pulling a fix from the template stays a merge rather than a
# rewrite. Reformatting them to this repository's house style would make every
# future re-sync a conflict, and enumerating per-rule ignores for code we do not
# own is a list that grows on someone else's schedule.
#
# They are not unchecked: upstream's own pyflakes pass runs over them in CI
# (.github/workflows/ci.yml), and tests/test_publish.py and
# tests/test_upload_data.py assert their behaviour directly. Everything this
# repository writes is held to the full rule set below.
extend-exclude = [
    "tools/publish.py",
    "tools/upload_data.py",
    "tests/test_links.py",
    "tests/test_publish.py",
    "tests/test_upload_data.py",
    "tests/test_stac_valid.py",
    "tests/test_conformance.py",
]
include = [
    "pyproject.toml",
    "src/glace_catalog/**/*.py",
    "scripts/**/*.py",
    "tools/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
# Taken verbatim from s1bursts, which carries the current first-party rule set.
# deep-glacier-mapping has an older one; where the two differ, s1bursts wins, so
# that code moving between first-party repositories does not change shape.
extend-select = [
    "E",    # Pycodestyle errors (style issues)
    "W",    # Pycodestyle warnings (style issues)
    "C90",  # McCabe - complexity metric for functions
    "I",    # isort - import ordering checks
    "N",    # PEP8 Naming - naming conventions
    "D",    # Pydocstyle - docstring formatting
    "UP",   # Pyupgrade - upgrades syntax to newer Python versions
    "ANN",  # Flake8-annotations - enforces type annotation style
    "ASYNC",# Flake8-async - checks async/await usage
    "S",    # Flake8-bandit - security issues
    "FBT",  # Flake8-boolean-trap - potential pitfalls with booleans
    "B",    # Flake8-bugbear - common bug patterns
    "A",    # Flake8-builtins - misuse of Python built-in names
    "COM",  # Flake8-commas - trailing/comma issues
    "C4",   # Flake8-comprehensions - best practices in comprehensions
    "EM",   # Flake8-errmsg - error message style
    "EXE",  # Flake8-executable - executable file checks
    "ISC",  # Flake8-implicit-str-concat - warns on implicit string concatenation
    "ICN",  # Flake8-import-conventions - enforces conventional import aliases
    "LOG",  # Flake8-logging - proper logging usage
    "G",    # Flake8-logging-format - logging format string issues
    "INP",  # Flake8-no-pep420 - warns against non-PEP420 namespace usage
    "PYI",  # Flake8-pyi - checks for type stub (.pyi) consistency
    "PT",   # Flake8-pytest-style - pytest best practices
    "Q",    # Flake8-quotes - enforces quote style consistency
    "RSE",  # Flake8-raise - proper raise statement usage
    "RET",  # Flake8-return - return statement issues
    "SLF",  # Flake8-self - flags instance methods that don't use self
    "SLOT", # Flake8-slots - suggests use of __slots__ where appropriate
    "SIM",  # Flake8-simplify - code simplification hints
    "TID",  # Flake8-tidy-imports - enforces specific import styles
    "TC",   # Flake8-type-checking - proper import of typing in type checks
    "ARG",  # Flake8-unused-arguments - flags unused function arguments
    "PTH",  # Flake8-use-pathlib - encourages pathlib over os.path
    "TD",   # Flake8-todos - flags TODO comments
    "FIX",  # Flake8-fixme - flags FIXME comments
    "PD",   # Pandas-vet - checks pandas-specific code practices
    "PGH",  # Pygrep-hooks - custom grep hooks for linting
    "PL",   # Pylint - integration with Pylint conventions
    "TRY",  # Tryceratops - try/except usage suggestions
    "NPY",  # NumPy-specific rules - ensures NumPy coding standards
    "PERF", # Perflint - performance-related checks
    "FURB", # Refurb - rules for code refurbishment
    "RUF",  # Ruff-specific rules - additional Ruff checks
]

ignore = [
    "ANN003",   # flake8-annotations - Missing type annotations for **kwargs
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "COM812",   # Trailing-comma rule that conflicts with the formatter
    "PLR0913",  # Pylint - Too many arguments
    "PLR0917",  # Pylint - Too many positional arguments
    "INP001",   # scripts/ and tools/ are deliberately not packages
]

[tool.ruff.lint.extend-per-file-ignores]
# The gates shell out to git, ruff and mypy with argv lists they build
# themselves. There is no shell and no external input, so flake8-bandit's
# subprocess rules have nothing to catch here; leaving them on would only teach
# the next person that a noqa is the normal way to write a gate.
"tests/**/*.py" = [
    "S101",     # Allow asserts in tests
    "S603",     # Gates run git, ruff and mypy with an argv list, never a shell
    "S607",     # `git` and the linters are resolved from PATH on purpose
    "PLR2004",  # Allow magic values in tests
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = false

[tool.ruff.lint.isort]
known-first-party = ["glace_catalog"]
force-sort-within-sections = true

[tool.mypy]
ignore_missing_imports = true
files = ["src/glace_catalog", "scripts"]
